name: Keep Supabase Alive

on:
  schedule:
    # Runs automatically every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret is not set. Skipping ping."
            exit 0
          fi
          # Sends a lightweight health check request to your Supabase project API
          curl -I "$SUPABASE_URL/rest/v1/"
