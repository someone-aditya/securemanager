<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureManager — Cloud Password Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CryptoJS for Client-Side AES Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            background-color: #09090b;
            background-image: radial-gradient(#27272a 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="text-zinc-100 min-h-screen font-sans antialiased flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-2xl bg-zinc-950/90 backdrop-blur-md border border-zinc-800 rounded-2xl p-6 md:p-8 shadow-2xl">
        
        <!-- Header -->
        <div class="flex justify-between items-center pb-6 border-b border-zinc-800/80 mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span class="text-emerald-400">◈</span> SecureManager
                </h1>
                <p class="text-xs text-zinc-400 mt-0.5">End-to-End Encrypted Cloud Storage</p>
            </div>
            <button id="logoutBtn" onclick="handleLogout()" class="hidden text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-3.5 py-2 rounded-lg border border-zinc-700 transition">
                Sign Out
            </button>
        </div>

        <!-- LANDING / AUTH SCREEN -->
        <div id="authSection" class="space-y-5 max-w-md mx-auto py-4">
            <div class="text-center space-y-1">
                <h2 id="authTitle" class="text-xl font-semibold text-white">Welcome Back</h2>
                <p id="authSubtitle" class="text-xs text-zinc-400">Sign in to decrypt and access your saved credentials.</p>
            </div>

            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Email Address</label>
                    <input type="email" id="emailInput" required placeholder="you@example.com" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Master Account Password</label>
                    <input type="password" id="passwordInput" required placeholder="••••••••••••" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold py-2.5 rounded-xl text-sm transition">
                    Sign In
                </button>
            </form>

            <div class="text-center pt-2">
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-xs text-zinc-400 hover:text-white transition">
                    Don't have an account? <span class="text-emerald-400 underline">Create one</span>
                </button>
            </div>
            <p id="authError" class="text-xs text-red-400 text-center hidden"></p>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden space-y-6">
            
            <!-- Add / Edit Form -->
            <form onsubmit="saveEntry(event)" class="bg-zinc-900/60 border border-zinc-800 p-4 rounded-xl space-y-3">
                <div class="flex justify-between items-center">
                    <h3 id="formHeader" class="text-sm font-medium text-zinc-200">Add New Credential</h3>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-zinc-400 hover:text-white">Cancel Edit</button>
                </div>
                <input type="hidden" id="editEntryId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="accountName" placeholder="Platform (e.g., Gmail, GitHub)" required class="bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <input type="text" id="accountUser" placeholder="Email or Username" required class="bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="flex gap-2">
                    <input type="text" id="accountPass" placeholder="Password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <button type="button" onclick="generateStrongPassword()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs px-3 rounded-lg border border-zinc-700 whitespace-nowrap">
                        Generate
                    </button>
                </div>

                <button type="submit" id="saveBtn" class="w-full bg-white hover:bg-zinc-200 text-black font-semibold py-2 rounded-lg text-sm transition">
                    Save to Vault
                </button>
            </form>

            <!-- Search Bar -->
            <div>
                <input type="text" id="searchInput" onkeyup="filterVault()" placeholder="Search saved accounts..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-zinc-600">
            </div>

            <!-- Saved Accounts List -->
            <div id="vaultContainer" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                <!-- Items rendered via JS -->
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // PASTE YOUR SUPABASE KEYS BELOW (INSIDE THE QUOTES)
        // ==========================================
        const SUPABASE_URL = 'https://jrdfoqijyddfzmplhdlc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kZFmMFEpRaTBBpEdzltVcQ_QHOacEah';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        let currentUser = null;
        let encryptionKey = ""; 
        let cachedEntries = [];

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('authTitle').textContent = isSignUp ? 'Create Your Vault' : 'Welcome Back';
            document.getElementById('authSubtitle').textContent = isSignUp 
                ? 'Your login password acts as your encryption key. Do not forget it.' 
                : 'Sign in to decrypt and access your saved credentials.';
            document.getElementById('authSubmitBtn').textContent = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('toggleAuthBtn').innerHTML = isSignUp 
                ? 'Already have an account? <span class="text-emerald-400 underline">Sign In</span>' 
                : 'Don\'t have an account? <span class="text-emerald-400 underline">Create one</span>';
            document.getElementById('authError').classList.add('hidden');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('authError');
            const btn = document.getElementById('authSubmitBtn');

            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            let result;
            if (isSignUp) {
                result = await supabase.auth.signUp({ email, password });
            } else {
                result = await supabase.auth.signInWithPassword({ email, password });
            }

            btn.disabled = false;
            btn.textContent = isSignUp ? 'Sign Up' : 'Sign In';

            if (result.error) {
                errorEl.textContent = result.error.message;
                errorEl.classList.remove('hidden');
                return;
            }

            currentUser = result.data.user;
            encryptionKey = password;
            document.getElementById('passwordInput').value = '';

            showDashboard();
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            currentUser = null;
            encryptionKey = "";
            cachedEntries = [];
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            fetchVault();
        }

        async function fetchVault() {
            const { data, error } = await supabase
                .from('vaults')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert('Error fetching vault: ' + error.message);
                return;
            }

            cachedEntries = data.map(row => {
                let decryptedPass = '••••••••';
                try {
                    const bytes = CryptoJS.AES.decrypt(row.encrypted_password, encryptionKey);
                    decryptedPass = bytes.toString(CryptoJS.enc.Utf8) || '[Decryption Error]';
                } catch (e) {
                    decryptedPass = '[Decryption Error]';
                }
                return { ...row, plain_password: decryptedPass };
            });

            renderVault(cachedEntries);
        }

        function renderVault(entries) {
            const container = document.getElementById('vaultContainer');
            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">No accounts saved yet. Add one above!</p>';
                return;
            }

            entries.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900/90 border border-zinc-800 p-4 rounded-xl flex flex-col gap-2.5';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-semibold text-sm text-white">${escapeHTML(item.account_name)}</h4>
                            <p class="text-xs text-zinc-400">${escapeHTML(item.username)}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="startEdit('${item.id}')" class="text-xs text-emerald-400 hover:text-emerald-300">Edit</button>
                            <button onclick="deleteEntry('${item.id}')" class="text-xs text-red-400 hover:text-red-300">Delete</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 pt-1">
                        <input type="password" id="pass-${item.id}" value="${escapeHTML(item.plain_password)}" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-zinc-200 font-mono">
                        <button onclick="toggleVisibility('${item.id}', this)" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1.5 rounded-lg">Show</button>
                        <button onclick="copyPassword('${escapeHTML(item.plain_password)}', this)" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1.5 rounded-lg">Copy</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function saveEntry(e) {
            e.preventDefault();
            const editId = document.getElementById('editEntryId').value;
            const account_name = document.getElementById('accountName').value;
            const username = document.getElementById('accountUser').value;
            const plainPass = document.getElementById('accountPass').value;

            const encrypted_password = CryptoJS.AES.encrypt(plainPass, encryptionKey).toString();

            if (editId) {
                const { error } = await supabase
                    .from('vaults')
                    .update({ account_name, username, encrypted_password })
                    .eq('id', editId);
                if (error) return alert(error.message);
            } else {
                const { error } = await supabase
                    .from('vaults')
                    .insert([{ user_id: currentUser.id, account_name, username, encrypted_password }]);
                if (error) return alert(error.message);
            }

            resetForm();
            fetchVault();
        }

        function startEdit(id) {
            const entry = cachedEntries.find(item => item.id === id);
            if (!entry) return;

            document.getElementById('editEntryId').value = entry.id;
            document.getElementById('accountName').value = entry.account_name;
            document.getElementById('accountUser').value = entry.username;
            document.getElementById('accountPass').value = entry.plain_password;

            document.getElementById('formHeader').textContent = 'Edit Credential';
            document.getElementById('saveBtn').textContent = 'Update Credential';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('editEntryId').value = '';
            document.getElementById('accountName').value = '';
            document.getElementById('accountUser').value = '';
            document.getElementById('accountPass').value = '';
            document.getElementById('formHeader').textContent = 'Add New Credential';
            document.getElementById('saveBtn').textContent = 'Save to Vault';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function deleteEntry(id) {
            if (!confirm('Delete this saved account?')) return;
            const { error } = await supabase.from('vaults').delete().eq('id', id);
            if (error) return alert(error.message);
            fetchVault();
        }

        function toggleVisibility(id, btn) {
            const input = document.getElementById(`pass-${id}`);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function copyPassword(text, btn) {
            navigator.clipboard.writeText(text);
            const original = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = original, 1500);
        }

        function generateStrongPassword() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+';
            let pass = '';
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('accountPass').value = pass;
        }

        function filterVault() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = cachedEntries.filter(item => 
                item.account_name.toLowerCase().includes(query) || 
                item.username.toLowerCase().includes(query)
            );
            renderVault(filtered);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }
    </script>
</body>
</html>
