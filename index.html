<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Family Password Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax5/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Family Password Manager</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-email" class="text-sm text-slate-300"></span>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">

        <!-- Auth Section -->
        <div id="auth-container" class="max-w-md mx-auto mt-12 bg-slate-800 p-8 rounded-xl shadow-lg border border-slate-700">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center">Login to Vault</h2>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email / ID</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-900 border border-slate-750 rounded p-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Master Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-900 border border-slate-750 rounded p-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">Login</button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-sm text-blue-400 hover:underline">Don't have an account? Create one</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-container" class="hidden space-y-6 mt-6">
            
            <!-- Add / Edit Credential Form Card -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md">
                <h3 id="form-heading" class="text-lg font-semibold mb-4">Add New Credential</h3>
                <form id="credential-form" onsubmit="saveCredential(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="hidden" id="cred-id">
                    <div>
                        <label class="block text-xs uppercase text-slate-400 mb-1">Platform Name</label>
                        <input type="text" id="platform-name" placeholder="e.g. Gmail, Netflix" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-slate-400 mb-1">Username / ID</label>
                        <input type="text" id="platform-username" placeholder="e.g. user@gmail.com" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-slate-400 mb-1">Password</label>
                        <input type="text" id="platform-password" placeholder="Password" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
                    </div>
                    <div class="md:col-span-3 flex gap-2">
                        <button type="submit" id="save-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded text-sm font-medium transition">Save Credential</button>
                        <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded text-sm transition">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Credentials List -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md">
                <h3 class="text-lg font-semibold mb-4">Saved Credentials</h3>
                <div id="credentials-list" class="space-y-3">
                    <!-- Populated dynamically -->
                    <p class="text-slate-400 text-sm">No credentials saved yet.</p>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        Secure Family Password Manager &bull; Client-side Encrypted
    </footer>

    <!-- App Logic Script -->
    <script>
        // 1. CONFIGURE YOUR SUPABASE KEYS HERE
        const SUPABASE_URL = 'https://jrdfoqijyddfzmplhdlc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kZFmMFEpRaTBBpEdzltVcQ_QHOacEah';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let isSignUpMode = false;
        let currentUser = null;
        let masterKey = ''; // Derived from user session/password for client encryption

        // Check active session on load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                masterKey = session.access_token; // Base encryption key layer
                showDashboard();
            }
        });

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? 'Create Account' : 'Login to Vault';
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? 'Sign Up' : 'Login';
            document.getElementById('auth-toggle-btn').innerText = isSignUpMode ? 'Already have an account? Login' : "Don't have an account? Create one";
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (isSignUpMode) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    alert('Error: ' + error.message);
                } else {
                    alert('Account created successfully! You can now log in.');
                    isSignUpMode = false;
                    toggleAuthMode();
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('Login failed: ' + error.message);
                } else {
                    currentUser = data.user;
                    masterKey = data.session.access_token;
                    showDashboard();
                }
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            masterKey = '';
            document.getElementById('dashboard-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('user-info').classList.add('hidden');
            document.getElementById('auth-form').reset();
        }

        function showDashboard() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('dashboard-container').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-email').innerText = currentUser.email;
            loadCredentials();
        }

        async function loadCredentials() {
            const { data, error } = await supabaseClient
                .from('credentials')
                .select('*')
                .order('created_at', { ascending: false });

            const listContainer = document.getElementById('credentials-list');
            if (error) {
                listContainer.innerHTML = `<p class="text-red-400 text-sm">Failed to load credentials: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-400 text-sm">No credentials saved yet.</p>`;
                return;
            }

            listContainer.innerHTML = '';
            data.forEach(item => {
                // Decrypt client-side data
                let decryptedPlatform = item.platform;
                let decryptedUsername = item.username;
                let decryptedPassword = '';
                
                try {
                    decryptedPlatform = CryptoJS.AES.decrypt(item.platform, masterKey).toString(CryptoJS.enc.Utf8) || item.platform;
                    decryptedUsername = CryptoJS.AES.decrypt(item.username, masterKey).toString(CryptoJS.enc.Utf8) || item.username;
                    decryptedPassword = CryptoJS.AES.decrypt(item.password, masterKey).toString(CryptoJS.enc.Utf8);
                } catch(e) {
                    decryptedPassword = 'Decryption Error';
                }

                const card = document.createElement('div');
                card.className = "bg-slate-900 p-4 rounded-lg border border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4";
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-base text-blue-400">${escapeHtml(decryptedPlatform)}</h4>
                        <p class="text-sm text-slate-300">ID/User: <span class="font-mono text-slate-100">${escapeHtml(decryptedUsername)}</span></p>
                        <p class="text-sm text-slate-400">Password: <span id="pass-${item.id}" class="font-mono text-slate-500">••••••••</span></p>
                    </div>
                    <div class="flex items-center gap-2 flex-wrap">
                        <button onclick="togglePassword('${item.id}', '${escapeHtml(decryptedPassword)}')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs">Show</button>
                        <button onclick="copyToClipboard('${escapeHtml(decryptedPassword)}')" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-xs">Copy</button>
                        <button onclick="editCredential('${item.id}', '${escapeHtml(decryptedPlatform)}', '${escapeHtml(decryptedUsername)}', '${escapeHtml(decryptedPassword)}')" class="bg-amber-600 hover:bg-amber-700 px-3 py-1 rounded text-xs">Edit</button>
                        <button onclick="deleteCredential('${item.id}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs">Delete</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        async function saveCredential(event) {
            event.preventDefault();
            const id = document.getElementById('cred-id').value;
            const platform = document.getElementById('platform-name').value;
            const username = document.getElementById('platform-username').value;
            const password = document.getElementById('platform-password').value;

            // Encrypt sensitive fields client-side
            const encPlatform = CryptoJS.AES.encrypt(platform, masterKey).toString();
            const encUsername = CryptoJS.AES.encrypt(username, masterKey).toString();
            const encPassword = CryptoJS.AES.encrypt(password, masterKey).toString();

            if (id) {
                // Update existing
                const { error } = await supabaseClient
                    .from('credentials')
                    .update({ platform: encPlatform, username: encUsername, password: encPassword })
                    .eq('id', id);

                if (error) alert('Update failed: ' + error.message);
            } else {
                // Insert new
                const { error } = await supabaseClient
                    .from('credentials')
                    .insert([{ platform: encPlatform, username: encUsername, password: encPassword, user_id: currentUser.id }]);

                if (error) alert('Save failed: ' + error.message);
            }

            resetForm();
            loadCredentials();
        }

        function editCredential(id, platform, username, password) {
            document.getElementById('cred-id').value = id;
            document.getElementById('platform-name').value = platform;
            document.getElementById('platform-username').value = username;
            document.getElementById('platform-password').value = password;
            document.getElementById('form-heading').innerText = 'Edit Credential';
            document.getElementById('save-btn').innerText = 'Update Credential';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteCredential(id) {
            if (confirm('Are you sure you want to delete this credential?')) {
                const { error } = await supabaseClient.from('credentials').delete().eq('id', id);
                if (error) alert('Delete failed: ' + error.message);
                loadCredentials();
            }
        }

        function resetForm() {
            document.getElementById('credential-form').reset();
            document.getElementById('cred-id').value = '';
            document.getElementById('form-heading').innerText = 'Add New Credential';
            document.getElementById('save-btn').innerText = 'Save Credential';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function togglePassword(id, plainPassword) {
            const span = document.getElementById(`pass-${id}`);
            if (span.innerText === '••••••••') {
                span.innerText = plainPassword;
                span.classList.remove('text-slate-500');
                span.classList.add('text-emerald-400');
            } else {
                span.innerText = '••••••••';
                span.classList.remove('text-emerald-400');
                span.classList.add('text-slate-500');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Password copied to clipboard!');
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
